name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Read-only, and no secrets: this runs the pull request's own scripts, so it holds nothing worth taking.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node scripts/check.mjs
      # Each entry the pull request adds or pins again, fetched at its commit as files and read, never run.
      - name: Scan the entries added or pinned again
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:index.json" > "$RUNNER_TEMP/base-index.json"
          node scripts/scan.mjs --changed "$RUNNER_TEMP/base-index.json"
