name: assets
# The assets track, assets/: every item's format, files and approval checked, read-only and with no secrets. Publishing
# to the catalog is a maintainer's, from a trusted checkout (assets/MAINTAINERS.md); no workflow holds R2 keys.
on:
  pull_request:
    paths: [assets/**, .github/workflows/assets.yml]
  push:
    branches: [main]
    paths: [assets/**, .github/workflows/assets.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/check.mjs
      - run: node --test scripts/*.test.mjs
